services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: namou_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d namou_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/namou_ecommerce?schema=public

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: namou_ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: ${JWT_SECRET}

    expose:
      - "3000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


volumes:
  postgres_data: